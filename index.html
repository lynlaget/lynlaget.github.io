<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delirium — Mina Lynum</title>

    <meta
        name="description"
        content="Delirium — tegning laget med vannfast blekk og micropenn av Mina Lynum."
    >

    <link rel="canonical" href="https://minalynum.no/">

    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #ff1493;
            color: white;

            font-family:
                "Neue Haas Grotesk Text Pro",
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;

            font-size: 16px;
            font-weight: 400;
        }


        /* =====================================
           NAVIGASJON
        ===================================== */

        .navbar {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding: 24px 32px;

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            align-items: start;

            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;

            font-size: 17px;
            line-height: 1;
        }

        .navbar a:hover {
            opacity: 0.55;
        }


        /* =====================================
           PROSJEKTER DROPDOWN
        ===================================== */

        .projects-dropdown {
            position: relative;
            justify-self: start;
        }

        .projects-link {
            display: block;
        }

        .projects-dropdown::after {
            content: "";

            position: absolute;

            top: 100%;
            left: 0;

            width: 220px;
            height: 20px;
        }

        .dropdown-menu {
            position: absolute;

            top: 28px;
            left: 0;

            width: 220px;

            padding: 10px 0 0;

            display: flex;
            flex-direction: column;

            opacity: 0;
            visibility: hidden;

            transform: translateY(-5px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            z-index: 2000;
        }

        .dropdown-menu a {
            display: block;

            padding: 4px 0;

            font-size: 14px;
            line-height: 1.2;
        }

        .dropdown-menu a:hover {
            opacity: 0.55;
        }

        .projects-dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;

            transform: translateY(0);
        }


        /* =====================================
           LOGO
        ===================================== */

        .logo {
            justify-self: center;
            text-align: center;

            font-size: 18px !important;
        }


        /* =====================================
           KONTAKT
        ===================================== */

        .contact-link {
            justify-self: end;
        }


        /* =====================================
           PROSJEKTSIDE
        ===================================== */

        .project-page {
            padding-top: 105px;
            padding-bottom: 120px;
        }


        /* =====================================
           INTRO
        ===================================== */

        .project-intro {
            width: 94%;
            max-width: 1900px;

            margin: 0 auto;

            padding: 45px 0 55px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                320px;

            gap: 70px;

            align-items: start;
        }


        /* =====================================
           TITTEL
        ===================================== */

        .project-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .project-title h1 {
            margin: 0;

            font-size: 88px;
            line-height: 0.9;

            font-weight: 400;
        }

        .year {
            margin-top: 55px;

            font-size: 15px;
            line-height: 1;
        }


        /* =====================================
           BESKRIVELSE
        ===================================== */

        .project-description {
            padding-top: 8px;
        }

        .project-description p {
            margin: 0;

            font-size: 15px;
            line-height: 1.35;
        }


        /* =====================================
           HOVEDBILDE
        ===================================== */

        .delirium-main {
            width: 94%;
            max-width: 1900px;

            margin: 0 auto 80px;
        }

        .delirium-main-image {
            width: 65%;
        }

        .delirium-main-image img {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;

            cursor: zoom-in;

            transition: opacity 0.3s ease;
        }

        .delirium-main-image img:hover {
            opacity: 0.8;
        }


        /* =====================================
           LIGHTBOX
        ===================================== */

        .lightbox {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(255, 20, 147, 0.96);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 40px;

            opacity: 0;
            visibility: hidden;

            z-index: 5000;

            transition: opacity 0.2s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-inner {
            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;
        }

        .lightbox-inner img {
            display: block;

            max-width: 95vw;
            max-height: 92vh;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* =====================================
           LUKKEKNAPP
        ===================================== */

        .close {
            position: absolute;

            top: 16px;
            right: 27px;

            border: 0;
            background: none;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 50px;
            font-weight: 200;

            line-height: 1;

            cursor: pointer;

            z-index: 5001;
        }

        .close:hover {
            opacity: 0.55;
        }

        .no-scroll {
            overflow: hidden;
        }


        /* =====================================
           MOBIL
        ===================================== */

        @media (max-width: 700px) {

            .navbar {
                padding: 18px;
            }

            .navbar a {
                font-size: 15px;
            }

            .logo {
                font-size: 16px !important;
            }


            /* DROPDOWN */

            .dropdown-menu {
                top: 25px;
                width: 200px;
            }

            .dropdown-menu a {
                font-size: 13px;
                padding: 4px 0;
            }


            /* SIDE */

            .project-page {
                padding-top: 90px;
                padding-bottom: 80px;
            }


            /* INTRO */

            .project-intro {
                width: 92%;

                padding: 50px 0 45px;

                display: block;
            }

            .project-title h1 {
                font-size: 54px;
            }

            .year {
                margin-top: 25px;

                font-size: 13px;
            }

            .project-description {
                max-width: 400px;

                margin-top: 30px;
            }


            /* HOVEDBILDE */

            .delirium-main {
                width: 92%;

                margin: 0 auto 45px;
            }

            .delirium-main-image {
                width: 100%;
            }

            .delirium-main-image img {
                width: 100%;
                height: auto;
            }


            /* LIGHTBOX */

            .lightbox {
                padding: 20px;
            }

            .lightbox-inner img {
                max-width: 97vw;
                max-height: 86vh;
            }

            .close {
                top: 10px;
                right: 17px;

                font-size: 42px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         NAVIGASJON
    ===================================== -->

    <header class="navbar">

        <div class="projects-dropdown">

            <a href="#prosjekter" class="projects-link">
                prosjekter
            </a>

            <div class="dropdown-menu">

                <a href="sider/prosjekter/delirium/index.html">
                    delirium
                </a>

                <a href="sider/prosjekter/argument/argument.html">
                    argument
                </a>

                <a href="sider/prosjekter/bachelor/bachelor.html">
                    bachelor
                </a>

                <a href="sider/prosjekter/omarsheriff/omarsheriff.html">
                    omar sheriff
                </a>

                <a href="sider/prosjekter/meaningoflife/meaningoflife.html">
                    meaning of life
                </a>

                <a href="sider/prosjekter/tresnitt/tresnitt.html">
                    tresnitt
                </a>

                <a href="sider/prosjekter/clockworksky/clockworksky.html">
                    clockwork sky
                </a>

                <a href="sider/prosjekter/lettering/lettering.html">
                    lettering
                </a>

                <a href="sider/prosjekter/pioner/pioner.html">
                    pionér
                </a>

                <a href="sider/prosjekter/pang/pang.html">
                    pang
                </a>

                <a href="sider/prosjekter/seep/seep.html">
                    seep
                </a>

                <a href="sider/prosjekter/142/142.html">
                    142
                </a>

            </div>

        </div>


        <a href="index.html" class="logo">
            mina lynum
        </a>


        <a href="sider/kontakt/kontakt.html" class="contact-link">
            kontakt
        </a>

    </header>



    <!-- =====================================
         DELIRIUM
    ===================================== -->

    <main id="prosjekter" class="project-page">


        <section class="project-intro">

            <div class="project-title">

                <h1>delirium</h1>

                <div class="year">
                    2026
                </div>

            </div>


            <div class="project-description">

                <p>
                    tegning laget med vannfast blekk, micropenn på
                    180grams papir. ta kontakt for lisens til bruk
                    eller kjøp.
                </p>

            </div>

        </section>



        <section class="delirium-main">

            <div class="delirium-main-image">

                <img
                    src="sider/prosjekter/delirium/deliriumsvart.png"
                    alt="Delirium – tegning av Mina Lynum"
                    class="zoomable"
                >

            </div>

        </section>

    </main>



    <!-- =====================================
         LIGHTBOX
    ===================================== -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <button
            class="close"
            id="close"
            aria-label="Lukk"
        >
            ×
        </button>


        <div
            class="lightbox-inner"
            id="lightboxInner"
        ></div>

    </div>



    <script>

        /* =====================================
           LIGHTBOX
        ===================================== */

        const zoomables =
            document.querySelectorAll(".zoomable");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxInner =
            document.getElementById("lightboxInner");

        const closeButton =
            document.getElementById("close");


        zoomables.forEach(element => {

            element.addEventListener("click", () => {

                lightboxInner.innerHTML = "";

                const image =
                    document.createElement("img");

                image.src = element.src;
                image.alt = element.alt;

                lightboxInner.appendChild(image);

                lightbox.classList.add("active");

                document.body.classList.add("no-scroll");

            });

        });


        function closeLightbox() {

            lightbox.classList.remove("active");

            document.body.classList.remove("no-scroll");

            lightboxInner.innerHTML = "";

        }


        closeButton.addEventListener(
            "click",
            closeLightbox
        );


        lightbox.addEventListener(
            "click",
            event => {

                if (event.target === lightbox) {
                    closeLightbox();
                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {
                    closeLightbox();
                }

            }
        );

    </script>


</body>

</html>
